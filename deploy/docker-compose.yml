services:
  site:
    image: nginx:alpine
    container_name: victoria-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.victoria.loadbalancer.server.port=80"
      # Router principal
      - "traefik.http.routers.victoria.rule=Host(`victoriaaquino.com.br`)"
      - "traefik.http.routers.victoria.entrypoints=websecure"
      - "traefik.http.routers.victoria.tls.certresolver=letsencrypt"
      # Router www -> redirect para dominio raiz
      - "traefik.http.routers.victoria-www.rule=Host(`www.victoriaaquino.com.br`)"
      - "traefik.http.routers.victoria-www.entrypoints=websecure"
      - "traefik.http.routers.victoria-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.victoria-www.middlewares=victoria-www-redirect"
      - "traefik.http.middlewares.victoria-www-redirect.redirectregex.regex=^https://www\\.victoriaaquino\\.com\\.br/(.*)"
      - "traefik.http.middlewares.victoria-www-redirect.redirectregex.replacement=https://victoriaaquino.com.br/$${1}"
      - "traefik.http.middlewares.victoria-www-redirect.redirectregex.permanent=true"

networks:
  proxy:
    external: true
